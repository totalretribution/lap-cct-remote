# Checks the code and builds the .deb and .rpm on every push and pull request.
# Publishing a GitHub release (tag v0.2.0, ...) builds them at the tag's version and attaches them to it.
name: Packages

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  packages:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb,cargo-generate-rpm,cargo-zigbuild

      # A release's packages get its tag's version (v0.2.0 -> 0.2.0); other builds use Cargo.toml's
      - name: Build the packages
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: ./package.sh "${TAG#v}"

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: packages/*
          if-no-files-found: error

  release:
    if: github.event_name == 'release'
    needs: packages
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: packages
      - name: Attach the packages to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" packages/* --repo "$GITHUB_REPOSITORY" --clobber
