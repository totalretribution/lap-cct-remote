# Checks the code and builds the .deb and .rpm on every push and pull request.
#
# Pushing a version tag releases it:
#   git tag v0.2.0 && git push origin v0.2.0
# builds the packages at the tag's version (0.2.0; Cargo.toml's doesn't matter) and publishes a GitHub
# release for the tag with them attached. To redo a release, run this workflow by hand on its tag.
name: Packages

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  packages:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb,cargo-generate-rpm,cargo-zigbuild

      # A tag's packages get its version (v0.2.0 -> 0.2.0); other builds use Cargo.toml's
      - name: Build the packages
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: ./package.sh "${TAG#v}"

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: packages/*
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    needs: packages
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: packages
      - run: cd packages && sha256sum * > SHA256SUMS
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # Reuse the release if there is one (made on GitHub first, or a rerun); otherwise create it
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" packages/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" packages/* --repo "$GITHUB_REPOSITORY" \
              --verify-tag --title "$TAG" --generate-notes
          fi
